name: Update Profile Telemetry & Snake

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch: # allow manual runs from the Actions tab
  push:
    branches:
      - master
      - main
    paths:
      - "src/**"
      - "package.json"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write # needed to publish generated SVGs to the "output" branch

concurrency:
  group: profile-output
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Generate live telemetry dashboard SVGs
        run: bun run build:live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Generate brand-matched contribution snake SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#101A1B&color_dots=#E6EDE9,#BCE882,#88D246,#4B9936,#1E5A27
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#C7F36B&color_dots=#162223,#24402D,#3F7338,#7FB94C,#C7F36B

      - name: Publish live SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
