<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" fill="none" role="img" aria-label="Remain — Production Architecture Blueprint">
  <title>Remain — Production Architecture Blueprint</title>
  <desc>System diagram connecting Angular Web App and MCP Server through Hono on Cloudflare Workers to Cloudflare Agents SDK (Durable Objects), PostgreSQL via Hyperdrive, R2, Upstash Redis, and Playwright CI.</desc>
  <defs>
    <pattern id="remain-light-grid" width="16" height="16" patternUnits="userSpaceOnUse">
    <circle cx="8" cy="8" r="0.85" fill="#1F3235" />
  </pattern>
    <filter id="remain-light-glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2" result="blur" />
    <feMerge>
      <feMergeNode in="blur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
    <clipPath id="remain-light-deck-clip">
      <rect x="18" y="62" width="844" height="202" rx="12" />
    </clipPath>
    <radialGradient id="remain-light-amber-glow" cx="76%" cy="28%" r="36%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="remain-light-lime-glow" cx="44%" cy="55%" r="34%">
      <stop offset="0%" stop-color="#C7F36B" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#C7F36B" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .sans { font-family: 'SF Pro Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Liberation Sans', 'DejaVu Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', ui-monospace, 'Cascadia Mono', 'Liberation Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  
    @keyframes flowPacket {
      0% { stroke-dashoffset: 180; opacity: 0; }
      14% { opacity: 1; }
      72% { opacity: 1; }
      100% { stroke-dashoffset: -30; opacity: 0; }
    }
    .remain-light-pkt {
      stroke-dasharray: 24 190;
      animation: flowPacket 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .remain-light-pkt-2 {
      stroke-dasharray: 22 190;
      animation: flowPacket 3.2s cubic-bezier(0.4, 0, 0.2, 1) 0.9s infinite;
    }
    .remain-light-pkt-3 {
      stroke-dasharray: 26 190;
      animation: flowPacket 3.2s cubic-bezier(0.4, 0, 0.2, 1) 1.5s infinite;
    }
    .remain-light-pkt-4 {
      stroke-dasharray: 20 190;
      animation: flowPacket 3.2s cubic-bezier(0.4, 0, 0.2, 1) 2.1s infinite;
    }
  </style>
  <rect x="0.5" y="0.5" width="879" height="339" rx="16" fill="#F4F7F5" stroke="#D3DFDA" stroke-width="1" />

  <!-- Top Product Header -->
  <!-- Remain amber emblem echoing actual app icon -->
  <rect x="20" y="16" width="28" height="28" rx="8" fill="#FBBF24" />
  <rect x="27" y="22" width="14" height="16" rx="3" fill="#101A1B" />
  <rect x="30" y="26" width="8" height="2.2" rx="1.1" fill="#FBBF24" />
  <rect x="30" y="31" width="5.5" height="2.2" rx="1.1" fill="#FBBF24" opacity="0.7" />

  <text x="58" y="29" class="sans" font-size="16" font-weight="700" fill="#101A1B">Remain<tspan dx="9" font-size="13" font-weight="400" fill="#495A58">—  AI-powered flashcard platform</tspan></text>
  <text x="58" y="46" class="sans" font-size="11.2" fill="#5E716E">Turn notes and PDFs into flashcard decks with an AI agent, refine by chat, and track what sticks.</text>

  <g>
    <rect x="643" y="18" width="217" height="24" rx="12" fill="#FEF3D6" stroke="#E5BE68" stroke-width="1" />
    <circle cx="656.5" cy="30" r="3" fill="#FBBF24" />
    <text x="666" y="33.230000000000004" class="mono" font-size="9.5" font-weight="600" letter-spacing="0.6" fill="#9A5B06">CLOUDFLARE EDGE · AGENTS SDK</text>
  </g>

  <!-- Center Animated Architecture Blueprint Deck -->
  <g clip-path="url(#remain-light-deck-clip)">
    <rect x="18" y="62" width="844" height="202" rx="12" fill="#101A1B" />
    <rect x="18" y="62" width="844" height="202" fill="url(#remain-light-grid)" opacity="0.6" />
    <rect x="18" y="62" width="844" height="202" fill="url(#remain-light-amber-glow)" />
    <rect x="18" y="62" width="844" height="202" fill="url(#remain-light-lime-glow)" />

    <!-- Column headers -->
    <text x="36" y="80" class="mono" font-size="8.6" font-weight="600" letter-spacing="0.9" fill="#718885">ENTRY INTERFACES</text>
    <text x="286" y="80" class="mono" font-size="8.6" font-weight="600" letter-spacing="0.9" fill="#718885">EDGE COMPUTE</text>
    <text x="572" y="80" class="mono" font-size="8.6" font-weight="600" letter-spacing="0.9" fill="#718885">AGENTS &amp; DATA PLANE</text>

    <!-- Static Circuit Traces -->
    <path d="M 206 117 H 246 V 148 H 286" stroke="#385154" stroke-width="1.5" stroke-linejoin="round" fill="none" />
    <path d="M 206 207 H 246 V 176 H 286" stroke="#385154" stroke-width="1.5" stroke-linejoin="round" fill="none" />
    <path d="M 498 142 H 536 V 108 H 572" stroke="#385154" stroke-width="1.5" stroke-linejoin="round" fill="none" />
    <path d="M 498 170 H 572" stroke="#385154" stroke-width="1.5" stroke-linejoin="round" fill="none" />
    <path d="M 498 190 H 536 V 224 H 572" stroke="#385154" stroke-width="1.5" stroke-linejoin="round" fill="none" />

    <!-- Animated Signal Packets -->
    <path class="remain-light-pkt" d="M 206 117 H 246 V 148 H 286" stroke="#C7F36B" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#remain-light-glow)" />
    <path class="remain-light-pkt-2" d="M 206 207 H 246 V 176 H 286" stroke="#5CE1E6" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#remain-light-glow)" />
    <path class="remain-light-pkt-3" d="M 498 142 H 536 V 108 H 572" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#remain-light-glow)" />
    <path class="remain-light-pkt-4" d="M 498 170 H 572" stroke="#C7F36B" stroke-width="1.9" stroke-linecap="round" fill="none" filter="url(#remain-light-glow)" />

    <!-- Connection Terminals -->
    <circle cx="206" cy="117" r="2.8" fill="#C7F36B" />
    <circle cx="206" cy="207" r="2.8" fill="#5CE1E6" />
    <circle cx="286" cy="148" r="2.8" fill="#C7F36B" />
    <circle cx="286" cy="176" r="2.8" fill="#5CE1E6" />
    <circle cx="498" cy="142" r="2.8" fill="#FBBF24" />
    <circle cx="498" cy="170" r="2.8" fill="#C7F36B" />
    <circle cx="498" cy="190" r="2.5" fill="#657B78" />
    <circle cx="572" cy="108" r="3" fill="#FBBF24" />
    <circle cx="572" cy="170" r="2.6" fill="#C7F36B" />
    <circle cx="572" cy="224" r="2.6" fill="#657B78" />

    <!-- Node: Angular Web App -->
    <rect x="34" y="90" width="172" height="58" rx="10" fill="#172527" stroke="#233639" stroke-width="1.1" />
    <circle cx="48" cy="109" r="3" fill="#C7F36B" />
    <text x="58" y="113" class="sans" font-size="12.2" font-weight="600" fill="#F4F7F5">Angular Web App</text>
    <text x="48" y="131" class="mono" font-size="9.2" fill="#A3B8B5">Study · Chat · Analytics</text>

    <!-- Node: MCP Server -->
    <rect x="34" y="176" width="172" height="58" rx="10" fill="#172527" stroke="#233639" stroke-width="1.1" />
    <circle cx="48" cy="195" r="3" fill="#5CE1E6" />
    <text x="58" y="199" class="sans" font-size="12.2" font-weight="600" fill="#F4F7F5">MCP Server</text>
    <text x="48" y="217" class="mono" font-size="9.2" fill="#A3B8B5">Claude.ai &amp; Claude Code</text>

    <!-- Center Hub: Hono on Cloudflare Workers -->
    <rect x="286" y="112" width="212" height="106" rx="11" fill="#1B2E26" stroke="#547935" stroke-width="1.3" />
    <rect x="300" y="124" width="128" height="18" rx="4" fill="#1C3026" stroke="#3B5D30" stroke-width="0.9" />
    <text x="308" y="136.3" class="mono" font-size="8.6" font-weight="700" letter-spacing="0.6" fill="#C7F36B">CLOUDFLARE WORKERS</text>
    <text x="300" y="164" class="sans" font-size="15" font-weight="700" fill="#F4F7F5">Hono Edge API</text>
    <text x="300" y="184" class="mono" font-size="9.4" fill="#A3B8B5">better-auth · CF Access</text>
    <text x="300" y="201" class="mono" font-size="9.4" fill="#718885">Passkeys · 2FA · Rate Limits</text>

    <!-- Featured AI Node: Cloudflare Agents SDK (Durable Objects) -->
    <rect x="572" y="90" width="272" height="48" rx="9" fill="#1E1C14" stroke="#8A6820" stroke-width="1.2" />
    <circle cx="586" cy="107" r="3" fill="#FBBF24" />
    <text x="596" y="111" class="sans" font-size="12" font-weight="700" fill="#F4F7F5">CF Agents SDK · Durable Objects</text>
    <text x="586" y="127" class="mono" font-size="9" fill="#E3C376">Streaming deck generation &amp; chat edits</text>

    <!-- 2x2 Data Plane Tiles -->
    
    <g>
      <rect x="572" y="148" width="132" height="44" rx="8" fill="#172527" stroke="#233639" stroke-width="1" />
      <circle cx="584" cy="164" r="2.4" fill="#5CE1E6" />
      <text x="593" y="167.5" class="sans" font-size="11" font-weight="600" fill="#F4F7F5">PostgreSQL</text>
      <text x="584" y="182.5" class="mono" font-size="9" fill="#A3B8B5">via Hyperdrive</text>
    </g>
    <g>
      <rect x="712" y="148" width="132" height="44" rx="8" fill="#172527" stroke="#233639" stroke-width="1" />
      <circle cx="724" cy="164" r="2.4" fill="#FBBF24" />
      <text x="733" y="167.5" class="sans" font-size="11" font-weight="600" fill="#F4F7F5">Cloudflare R2</text>
      <text x="724" y="182.5" class="mono" font-size="9" fill="#A3B8B5">PDFs &amp; notes</text>
    </g>
    <g>
      <rect x="572" y="202" width="132" height="44" rx="8" fill="#172527" stroke="#233639" stroke-width="1" />
      <circle cx="584" cy="218" r="2.4" fill="#C7F36B" />
      <text x="593" y="221.5" class="sans" font-size="11" font-weight="600" fill="#F4F7F5">Upstash Redis</text>
      <text x="584" y="236.5" class="mono" font-size="9" fill="#A3B8B5">Cache &amp; rate limits</text>
    </g>
    <g>
      <rect x="712" y="202" width="132" height="44" rx="8" fill="#172527" stroke="#233639" stroke-width="1" />
      <circle cx="724" cy="218" r="2.4" fill="#A78BFA" />
      <text x="733" y="221.5" class="sans" font-size="11" font-weight="600" fill="#F4F7F5">Playwright CI</text>
      <text x="724" y="236.5" class="mono" font-size="9" fill="#A3B8B5">e2e + auto-deploy</text>
    </g>
  </g>
  <rect x="18.5" y="62.5" width="843" height="201" rx="12" fill="none" stroke="#233639" stroke-width="1" />

  <!-- Bottom 4 Capability Highlights -->
  
    <g>
      
      <text x="24" y="294" class="mono" font-size="9.2" font-weight="700" letter-spacing="0.6" fill="#33660F">01 · GENERATE &amp; REFINE</text>
      <text x="24" y="314" class="sans" font-size="11.5" fill="#495A58">Upload PDFs, edit decks via chat</text>
    </g>
    <g>
      <line x1="224" y1="282" x2="224" y2="322" stroke="#D3DFDA" stroke-width="1" />
      <text x="238" y="294" class="mono" font-size="9.2" font-weight="700" letter-spacing="0.6" fill="#33660F">02 · STUDY TELEMETRY</text>
      <text x="238" y="314" class="sans" font-size="11.5" fill="#495A58">Heatmaps, accuracy &amp; hard cards</text>
    </g>
    <g>
      <line x1="438" y1="282" x2="438" y2="322" stroke="#D3DFDA" stroke-width="1" />
      <text x="452" y="294" class="mono" font-size="9.2" font-weight="700" letter-spacing="0.6" fill="#33660F">03 · MCP SERVER</text>
      <text x="452" y="314" class="sans" font-size="11.5" fill="#495A58">Manage decks inside Claude</text>
    </g>
    <g>
      <line x1="652" y1="282" x2="652" y2="322" stroke="#D3DFDA" stroke-width="1" />
      <text x="666" y="294" class="mono" font-size="9.2" font-weight="700" letter-spacing="0.6" fill="#33660F">04 · REAL AUTH &amp; E2E</text>
      <text x="666" y="314" class="sans" font-size="11.5" fill="#495A58">Passkeys, 2FA &amp; GitHub Actions</text>
    </g>
  
</svg>
